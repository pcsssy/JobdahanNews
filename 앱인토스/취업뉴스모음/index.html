<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fa">
  <title>JobdahanNews · 잡다한뉴스</title>
  <link rel="stylesheet" href="./src/styles.css">
  <link rel="stylesheet" href="./src/brand.css">
  <link rel="stylesheet" href="./src/dark-palette.css">
  <script src="./src/theme.js"></script>
</head>
<body>
  <div class="app">
    <header class="brand"><span class="job-mark" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><path d="M11 8h14l6 6v18H11z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M25 8v7h6M16 19h10M16 24h6M7 13v23h19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span><span class="brand-name">JobdahanNews<small>잡다한뉴스</small></span><button id="theme-toggle" class="theme-toggle" aria-label="다크 모드 켜기" aria-pressed="false">다크 모드</button><button id="open-settings" class="settings-button" aria-label="설정 열기">설정</button></header>
    <main>
      <section class="intro"><p class="eyebrow">READ. THINK. MAKE IT YOURS.</p><h1>잡다한 세상 소식이,<br>나만의 이야기가 되도록.</h1><p>관심 분야의 흐름을 읽고, 내 생각을 메모해 보세요.</p></section>
      <button id="open-notes" class="notes-launch">나의 뉴스 노트 <span>모아보기 ↗</span></button>
      <div class="demo-notice">네이버 뉴스 검색으로 기사를 모아요. 제목을 누르면 원문으로 이동해요.</div>
      <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="관심 키워드로 찾아보세요" aria-label="뉴스 검색"></label>
      <section class="interests" aria-labelledby="interest-title">
        <div class="section-title"><h2 id="interest-title">어떤 분야가 궁금하세요?</h2><button id="reset" class="text-button">선택 초기화</button></div>
        <p class="filter-help">필요한 주제만 고르면, 뉴스가 그 기준으로 정리돼요.</p>
        <div class="topic-selection">
          <div id="selected-topics" class="selected-topics" aria-live="polite"></div>
          <details class="topic-drawer">
            <summary>관심 분야 고르기 <span id="topic-count">0개 선택</span></summary>
            <div id="topics" class="topic-grid"></div>
          </details>
        </div>
        <button id="save-interests" class="save-interests">현재 선택을 관심 분야로 저장</button>
      </section>
      <nav class="tabs" aria-label="뉴스 모아보기"><button data-view="all" aria-pressed="true">전체 뉴스</button><button data-view="interest" aria-pressed="false">관심 뉴스</button><button data-view="saved" aria-pressed="false">저장한 뉴스 <span id="saved-count">0</span></button></nav>
      <div class="feed-heading"><h2 id="feed-title">분야의 흐름을 읽어보세요</h2><span id="result-count"></span></div>
      <div id="news-list" class="news-list"></div>
      <button id="load-more" class="load-more" hidden>뉴스 더 보기</button>
      <footer>JobdahanNews · 잡다한뉴스<br><span>뉴스 검색 제공: 네이버 · 분야는 검색어 기준입니다.</span></footer>
    </main>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="./src/data/categories.js"></script>
  <script src="./src/notes.js"></script>
  <script src="./src/live-app.js"></script>
  <script src="./src/settings.js"></script>
</body>
</html>
